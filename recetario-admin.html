<!DOCTYPE html>
<!--
  RECETARIO NATIVO AÇAÍ — panel de administración
  archivo : recetario-admin.html    (esta pantalla, protegida con clave)
  visor   : recetario.html          (lo que ven los locales en el iPad)
  base    : tabla "recetario" + bucket "recetario" en Supabase
  sql     : recetario-supabase.sql
-->
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Panel del recetario · nativo açaí</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --porcelain:#F4F1F6; --paper:#fff;
  --grape:#2A1633; --grape-70:rgba(42,22,51,.70); --grape-45:rgba(42,22,51,.45);
  --pulp:#5B2A82; --pulp-soft:#EDE3F5; --pulp-deep:#3D1A59;
  --maracuya:#F0A33C; --palm:#2E7D5B; --rojo:#C2334D;
  --line:rgba(42,22,51,.13); --line-2:rgba(42,22,51,.07);
  --shadow:0 1px 2px rgba(42,22,51,.05), 0 10px 30px -14px rgba(42,22,51,.2);
  --d:'Bricolage Grotesque',system-ui,sans-serif;
  --b:'Inter Tight',system-ui,-apple-system,sans-serif;
  --m:ui-monospace,'SF Mono',Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--porcelain);color:var(--grape);font-family:var(--b);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--maracuya);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--d);letter-spacing:-.03em;margin:0}
.oculto{display:none!important}

/* clave */
.puerta{min-height:100vh;display:grid;place-items:center;padding:24px}
.puerta .caja{width:100%;max-width:370px;background:var(--paper);border:1px solid var(--line);
  border-radius:24px;padding:34px 30px;box-shadow:var(--shadow)}
.puerta .mark{width:42px;height:42px;margin-bottom:18px}
.puerta h1{font-size:24px;margin-bottom:6px}
.puerta p.s{color:var(--grape-45);margin:0 0 22px;font-size:14.5px}
.campo{margin-bottom:14px}
.campo label{display:block;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--grape-45);margin-bottom:6px}
.campo input,.campo textarea{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:11px;
  background:var(--paper);outline:none;transition:border-color .15s}
.campo input:focus,.campo textarea:focus{border-color:var(--pulp)}
.pri{width:100%;background:var(--pulp);color:#fff;padding:13px;border-radius:11px;font-weight:650;transition:.15s}
.pri:hover{background:var(--pulp-deep)}
.err{background:#FDECEF;color:#8E1F33;border:1px solid #F5CBD3;padding:11px 14px;border-radius:11px;font-size:14px;margin-bottom:14px}

/* layout */
.app{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:100vh}
@media (max-width:960px){.app{grid-template-columns:1fr}}
.lat{background:var(--paper);border-right:1px solid var(--line);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow:hidden}
@media (max-width:960px){.lat{position:static;height:auto;overflow:visible;border-right:0;border-bottom:1px solid var(--line)}}
.lat .cab{padding:20px 18px 14px;border-bottom:1px solid var(--line-2)}
.lat .cab .f1{display:flex;align-items:center;gap:11px;margin-bottom:16px}
.lat .cab .mark{width:29px;height:29px;flex:none}
.lat .cab b{display:block;font-family:var(--d);font-weight:800;font-size:16px;letter-spacing:-.03em}
.lat .cab span{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--grape-45);font-weight:700}
.buscar{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:10px}
.buscar input{border:0;outline:none;background:none;width:100%}
.nuevo{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--pulp);color:#fff;
  padding:11px;border-radius:10px;font-weight:650}
.nuevo:hover{background:var(--pulp-deep)}
.lista{flex:1;overflow-y:auto;padding:10px}
.item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:12px;width:100%;text-align:left;transition:background .12s}
.item:hover{background:var(--porcelain)}
.item[aria-current=true]{background:var(--pulp-soft)}
.item .mini{width:40px;height:50px;border-radius:8px;background:var(--pulp-soft);flex:none;
  display:grid;place-items:center;overflow:hidden;font-family:var(--m);font-size:9px;color:var(--pulp);text-align:center}
.item .mini img{width:100%;height:100%;object-fit:cover}
.item .t{min-width:0;flex:1}
.item .t b{display:block;font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t span{display:block;font-size:12px;color:var(--grape-45)}
.item .punto{width:7px;height:7px;border-radius:99px;flex:none;background:var(--palm)}
.item .punto.off{background:rgba(42,22,51,.22)}
.item .flechas{display:flex;flex-direction:column;gap:2px;opacity:.4}
.item .flechas span{width:22px;height:17px;display:grid;place-items:center;border-radius:5px}
.item .flechas span:hover{background:rgba(42,22,51,.1);opacity:1}
.lat .pie{padding:12px 16px;border-top:1px solid var(--line-2);display:flex;align-items:center;gap:12px;font-size:12.5px}
.lat .pie a{color:var(--pulp);font-weight:600;text-decoration:none}
.lat .pie button{color:var(--grape-45);font-size:12.5px;font-weight:600}
.lat .pie button:hover{color:var(--pulp)}
.lat .pie .salir{margin-left:auto;color:var(--rojo)}

/* editor */
.ed{padding:26px 30px 92px;max-width:1180px}
@media (max-width:600px){.ed{padding:20px 18px 92px}}
.ed > h2{font-size:26px;margin-bottom:2px}
.ed > .sub{color:var(--grape-45);margin:0 0 22px;font-size:14.5px}
.bloque{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:18px}
.bloque > h3{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--grape-45);margin-bottom:16px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:700px){.dos{grid-template-columns:1fr}}
.pista{font-size:12.5px;color:var(--grape-45);margin:6px 0 0}
.pista code{font-family:var(--m);font-size:11.5px;background:var(--pulp-soft);padding:2px 5px;border-radius:4px;color:var(--pulp-deep)}
.foto-zona{display:flex;gap:16px;align-items:flex-start}
.foto-prev{width:124px;height:155px;border-radius:14px;background:var(--pulp-soft);overflow:hidden;flex:none;
  display:grid;place-items:center;border:1px solid var(--line)}
.foto-prev img{width:100%;height:100%;object-fit:cover}
.sec{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);padding:9px 16px;border-radius:10px;
  font-weight:600;font-size:14px;background:var(--paper)}
.sec:hover{border-color:var(--pulp);color:var(--pulp)}
.sec.peligro:hover{border-color:var(--rojo);color:var(--rojo)}

/* escritura + vista previa */
.escribir{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
@media (max-width:960px){.escribir{grid-template-columns:1fr}}
.escribir textarea{width:100%;min-height:420px;padding:16px 18px;border:1px solid var(--line);border-radius:14px;
  background:var(--paper);outline:none;resize:vertical;line-height:1.6;font-size:15.5px}
.escribir textarea:focus{border-color:var(--pulp)}
.previa{border:1px dashed var(--line);border-radius:14px;padding:20px 22px;background:var(--porcelain);min-height:420px}
.previa > .rot{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--grape-45);margin:0 0 16px}

/* mismo render que el iPad */
.cuerpo{font-size:17px;line-height:1.6}
.cuerpo p{margin:0 0 13px}
.cuerpo strong{font-weight:700;color:var(--pulp-deep)}
.cuerpo h3.sec{font-family:var(--d);font-size:14px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--pulp);margin:26px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.cuerpo h3.sec:first-child{margin-top:0}
.cuerpo ol.pasos{list-style:none;padding:0;margin:0 0 14px}
.cuerpo ol.pasos li{display:grid;grid-template-columns:38px minmax(0,1fr);gap:14px;padding:12px 0;border-top:1px solid var(--line-2)}
.cuerpo ol.pasos li:first-child{border-top:0;padding-top:2px}
.cuerpo ol.pasos .n{font-family:var(--d);font-size:23px;font-weight:800;letter-spacing:-.05em;color:var(--pulp);
  line-height:1.1;font-variant-numeric:tabular-nums}
.cuerpo ul.puntos{list-style:none;padding:0;margin:0 0 14px}
.cuerpo ul.puntos li{display:grid;grid-template-columns:16px minmax(0,1fr);gap:11px;padding:4px 0}
.cuerpo ul.puntos li i{width:6px;height:6px;border-radius:99px;background:var(--maracuya);margin-top:11px}
.cuerpo .sin{color:var(--grape-45)}

/* barra */
.barra{position:fixed;bottom:0;left:320px;right:0;background:rgba(255,255,255,.93);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:13px 30px;display:flex;align-items:center;gap:12px;z-index:10}
@media (max-width:960px){.barra{left:0;padding:13px 18px}}
.barra .est{font-size:13px;color:var(--grape-45);margin-right:auto}
.barra .est.sucio{color:#A96A0A;font-weight:600}
.barra .guardar{background:var(--pulp);color:#fff;padding:12px 26px;border-radius:11px;font-weight:650}
.barra .guardar:hover{background:var(--pulp-deep)}
.barra .guardar:disabled{opacity:.5;cursor:default}

.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--grape);color:#fff;padding:12px 22px;border-radius:12px;font-weight:600;font-size:14.5px;
  z-index:50;transition:.22s;pointer-events:none;box-shadow:0 12px 30px -8px rgba(42,22,51,.5);max-width:86vw;text-align:center}
.toast.ver{opacity:1;transform:translateX(-50%)}
.toast.malo{background:var(--rojo)}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;font-size:14.5px}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch .p2{width:44px;height:26px;border-radius:99px;background:rgba(42,22,51,.18);position:relative;transition:.2s;flex:none}
.switch .p2::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:99px;background:#fff;
  transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked + .p2{background:var(--palm)}
.switch input:checked + .p2::after{transform:translateX(18px)}
.nada{text-align:center;padding:80px 24px;color:var(--grape-45)}
.nada h2{font-size:22px;color:var(--grape);margin-bottom:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="puerta" id="vPuerta">
  <div class="caja">
    <svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <circle cx="15" cy="19" r="11" fill="#5B2A82"/>
      <circle cx="11.5" cy="15.5" r="2.6" fill="#fff" opacity=".38"/>
      <path d="M16.5 8.5C18.6 3.9 23.4 1.8 28.5 2.5c.6 4.9-1.4 9.4-6.2 11.2-2.4.9-4.5.4-5.8-.9-1.3-1.3-1.2-2.9 0-4.3Z" fill="#2E7D5B"/>
    </svg>
    <h1>Panel del recetario</h1>
    <p class="s">Lo que edites acá se actualiza en los iPad de todos los locales.</p>
    <div class="err oculto" id="claveErr">Clave incorrecta.</div>
    <div class="campo"><label for="cv">Clave</label><input id="cv" type="password" autocomplete="current-password"></div>
    <button class="pri" id="btnEntrar">Entrar</button>
  </div>
</div>

<div class="app oculto" id="vApp">
  <aside class="lat">
    <div class="cab">
      <div class="f1">
        <svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <circle cx="15" cy="19" r="11" fill="#5B2A82"/>
          <circle cx="11.5" cy="15.5" r="2.6" fill="#fff" opacity=".38"/>
          <path d="M16.5 8.5C18.6 3.9 23.4 1.8 28.5 2.5c.6 4.9-1.4 9.4-6.2 11.2-2.4.9-4.5.4-5.8-.9-1.3-1.3-1.2-2.9 0-4.3Z" fill="#2E7D5B"/>
        </svg>
        <div><b>nativo açaí</b><span>Panel del recetario</span></div>
      </div>
      <div class="buscar">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" opacity=".45"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="filtro" type="search" placeholder="Buscar receta" autocomplete="off">
      </div>
      <button class="nuevo" id="btnNueva">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Crear producto
      </button>
    </div>
    <div class="lista" id="lista"></div>
    <div class="pie">
      <a href="recetario.html" target="_blank" rel="noopener">Ver recetario ↗</a>
      <button id="btnCopia">Descargar respaldo</button>
      <button class="salir" id="btnSalir">Salir</button>
    </div>
  </aside>
  <main id="panel"></main>
</div>

<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════════
   CONFIGURACIÓN
   Los mismos datos de Supabase que pusiste en recetario.html,
   más la clave para entrar a este panel. Cámbiala.
   ═══════════════════════════════════════════════════════════ */
const CONFIG = {
  SUPABASE_URL : 'https://nmqyneadbtmwhmlkarcy.supabase.co',
  SUPABASE_ANON: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5tcXluZWFkYnRtd2htbGthcmN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyNDczMzMsImV4cCI6MjEwMDgyMzMzM30.Zqd70QKgESXJSSvPv5FKW2QMpBeqKrnDmyNsBJB4yYU',
  CLAVE        : '1234'     // clave para entrar a este panel
};
/* ═══════════════════════════════════════════════════════════ */

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let recetas = [], sel = null, sucio = false, filtro = '';

/* ── mismo formateador que el visor ──────────────────── */
function formatear(txt){
  const linea = s => esc(s).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  let html = '', lista = null;
  const cerrar = () => { if (lista){ html += lista === 'ol' ? '</ol>' : '</ul>'; lista = null } };
  for (const cruda of String(txt || '').replace(/\r/g, '').split('\n')){
    const l = cruda.trim();
    if (!l){ cerrar(); continue }
    let m;
    if ((m = l.match(/^#{1,3}\s*(.+)$/))){ cerrar(); html += `<h3 class="sec">${linea(m[1])}</h3>`; continue }
    if ((m = l.match(/^(\d{1,3})(?:\s*[.)]|-)\s+(.+)$/))){
      if (lista !== 'ol'){ cerrar(); html += '<ol class="pasos">'; lista = 'ol' }
      html += `<li><span class="n">${esc(m[1])}</span><div>${linea(m[2])}</div></li>`; continue;
    }
    if ((m = l.match(/^[-•*·–—]\s+(.+)$/))){
      if (lista !== 'ul'){ cerrar(); html += '<ul class="puntos">'; lista = 'ul' }
      html += `<li><i></i><div>${linea(m[1])}</div></li>`; continue;
    }
    cerrar(); html += `<p>${linea(l)}</p>`;
  }
  cerrar();
  return html || '<p class="sin">Acá vas a ver cómo queda la preparación en el iPad.</p>';
}

/* ── avisos ──────────────────────────────────────────── */
let tRef;
function aviso(txt, malo){
  const t = $('#toast'); t.textContent = txt;
  t.classList.toggle('malo', !!malo); t.classList.add('ver');
  clearTimeout(tRef); tRef = setTimeout(() => t.classList.remove('ver'), malo ? 15000 : 2800);
}
function marcarSucio(){ sucio = true; const e = $('#estado'); if (e){ e.textContent = 'Cambios sin guardar'; e.classList.add('sucio') } }

/* ── llamadas a Supabase (REST, sin librerías) ───────── */
const H = extra => Object.assign({
  apikey: CONFIG.SUPABASE_ANON,
  Authorization: 'Bearer ' + CONFIG.SUPABASE_ANON
}, extra || {});

async function api(metodo, ruta, cuerpo){
  const r = await fetch(CONFIG.SUPABASE_URL + '/rest/v1' + ruta, {
    method: metodo,
    headers: H({ 'Content-Type':'application/json', Prefer:'return=representation' }),
    body: cuerpo ? JSON.stringify(cuerpo) : undefined,
    cache: 'no-store'
  });
  const txt = await r.text();
  let data = null;
  try { data = txt ? JSON.parse(txt) : null } catch(e){ data = null }
  if (!r.ok) throw new Error((data && (data.message || data.hint)) || ('HTTP ' + r.status));
  return data;
}

/* ── imágenes ────────────────────────────────────────── */
async function abrirImagen(file){
  try { return await createImageBitmap(file) } catch(e){}
  return new Promise((ok, mal) => {                 // respaldo (HEIC de iPhone, etc.)
    const url = URL.createObjectURL(file), im = new Image();
    im.onload  = () => { ok(im); URL.revokeObjectURL(url) };
    im.onerror = () => { mal(new Error('formato no soportado')); URL.revokeObjectURL(url) };
    im.src = url;
  });
}
async function comprimir(file){
  const img = await abrirImagen(file);
  const w0 = img.naturalWidth || img.width, h0 = img.naturalHeight || img.height;
  if (!w0 || !h0) throw new Error('no se pudo leer la imagen');
  const r = Math.min(1, 1400 / Math.max(w0, h0));
  const c = document.createElement('canvas');
  c.width = Math.round(w0 * r); c.height = Math.round(h0 * r);
  const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
  x.drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', 0.82));
  if (!blob) throw new Error('no se pudo procesar la imagen');
  return blob;
}
async function subir(file){
  let blob, ext = 'jpg', tipo = 'image/jpeg';
  try { blob = await comprimir(file) }
  catch(e){
    if (file.size > 8e6) throw new Error('la imagen es muy grande y no se pudo comprimir');
    blob = file; tipo = file.type || 'image/jpeg';
    ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,4) || 'jpg';
  }
  const ruta = `productos/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
  const destino = `${CONFIG.SUPABASE_URL}/storage/v1/object/recetario/${ruta}`;

  // Intento 1: multipart/form-data (lo que usa la librería oficial en el navegador).
  // No hay que fijar Content-Type: el navegador pone el boundary.
  const fd = new FormData();
  fd.append('cacheControl', '3600');
  fd.append('', blob, ruta.split('/').pop());
  let r = await fetch(destino, { method:'POST', headers: H({ 'x-upsert':'true' }), body: fd });
  if (r.ok) return `${CONFIG.SUPABASE_URL}/storage/v1/object/public/recetario/${ruta}`;
  const e1 = `${r.status} ${(await r.text()).slice(0,160)}`;

  // Intento 2: cuerpo binario directo.
  r = await fetch(destino, { method:'POST', headers: H({ 'Content-Type':tipo, 'x-upsert':'true' }), body: blob });
  if (r.ok) return `${CONFIG.SUPABASE_URL}/storage/v1/object/public/recetario/${ruta}`;
  const e2 = `${r.status} ${(await r.text()).slice(0,160)}`;

  throw new Error(`multipart → ${e1}  ·  binario → ${e2}`);
}
function pedirFoto(alListo){
  const i = document.createElement('input');
  i.type = 'file'; i.accept = 'image/*';
  i.onchange = async () => {
    const f = i.files[0]; if (!f) return;
    aviso('Subiendo foto…');
    try { alListo(await subir(f)); aviso('Foto lista') }
    catch(e){ aviso('No se pudo subir la foto. ' + (e.message || ''), true) }
  };
  i.click();
}

/* ── puerta ──────────────────────────────────────────── */
function entrar(){
  if ($('#cv').value !== CONFIG.CLAVE){ $('#claveErr').classList.remove('oculto'); return }
  try { sessionStorage.setItem('nativo:recetario:panel', '1') } catch(e){}
  abrirApp();
}
async function abrirApp(){
  $('#vPuerta').classList.add('oculto'); $('#vApp').classList.remove('oculto');
  await traer(); pintarVacio();
}
$('#btnEntrar').addEventListener('click', entrar);
$('#cv').addEventListener('keydown', e => { if (e.key === 'Enter') entrar() });
$('#btnSalir').addEventListener('click', () => {
  if (sucio && !confirm('Tienes cambios sin guardar. ¿Salir igual?')) return;
  try { sessionStorage.removeItem('nativo:recetario:panel') } catch(e){}
  location.reload();
});

/* ── lista ───────────────────────────────────────────── */
async function traer(){
  try {
    recetas = await api('GET', '/recetario?select=*&order=orden.asc,nombre.asc') || [];
  } catch(e){ aviso('No se pudo cargar la lista. ' + e.message, true); recetas = [] }
  pintarLista();
}

function pintarLista(){
  const q = filtro.trim().toLowerCase();
  const vis = recetas.filter(r => !q || (r.nombre + ' ' + (r.categoria || '')).toLowerCase().includes(q));
  const L = $('#lista');
  if (!recetas.length){
    L.innerHTML = '<p style="padding:26px 14px;color:var(--grape-45);font-size:14px;text-align:center">Sin productos todavía. Toca “Crear producto”.</p>';
    return;
  }
  L.innerHTML = vis.map(r => `
    <button class="item" data-id="${esc(r.id)}" aria-current="${!!(sel && sel.id === r.id)}">
      <span class="mini">${r.imagen_url ? `<img src="${esc(r.imagen_url)}" alt="">` : 'sin<br>foto'}</span>
      <span class="t"><b>${esc(r.nombre)}</b><span>${esc(r.categoria || 'General')}</span></span>
      <span class="punto ${r.activo ? '' : 'off'}" title="${r.activo ? 'Visible en los iPad' : 'Oculto'}"></span>
      <span class="flechas">
        <span data-mover="-1" data-id="${esc(r.id)}" title="Subir"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></span>
        <span data-mover="1" data-id="${esc(r.id)}" title="Bajar"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
      </span>
    </button>`).join('');
}

$('#lista').addEventListener('click', e => {
  const mv = e.target.closest('[data-mover]');
  if (mv) return mover(mv.dataset.id, +mv.dataset.mover);
  const it = e.target.closest('.item'); if (!it) return;
  if (sucio && !confirm('Tienes cambios sin guardar. ¿Cambiar de producto igual?')) return;
  const r = recetas.find(x => x.id === it.dataset.id); if (!r) return;
  sel = Object.assign({}, r);
  pintarEditor(); pintarLista();
});
$('#filtro').addEventListener('input', e => { filtro = e.target.value; pintarLista() });

async function mover(id, dir){
  const i = recetas.findIndex(r => r.id === id), j = i + dir;
  if (i < 0 || j < 0 || j >= recetas.length) return;
  const tmp = recetas[i]; recetas[i] = recetas[j]; recetas[j] = tmp;

  const cambios = [];
  recetas.forEach((r, k) => { const n = (k + 1) * 10; if (r.orden !== n){ r.orden = n; cambios.push(r) } });
  if (sel && sel.id){
    const f = recetas.find(x => x.id === sel.id);
    if (f) sel.orden = f.orden;
  }
  pintarLista();
  try {
    for (const r of cambios) await api('PATCH', '/recetario?id=eq.' + encodeURIComponent(r.id), { orden:r.orden });
  } catch(e){ aviso('No se pudo guardar el orden. ' + e.message, true) }
}

/* ── editor ──────────────────────────────────────────── */
function pintarVacio(){
  sel = null;
  $('#panel').innerHTML = `<div class="nada">
    <h2>${recetas.length ? 'Elige un producto de la lista' : 'Todavía no hay productos'}</h2>
    <p>${recetas.length ? 'O crea uno nuevo para sumarlo al recetario de los locales.' : 'Crea el primero y aparecerá al tiro en los iPad.'}</p>
  </div>`;
}

$('#btnNueva').addEventListener('click', () => {
  if (sucio && !confirm('Tienes cambios sin guardar. ¿Crear uno nuevo igual?')) return;
  sel = { id:null, nombre:'', categoria:'', imagen_url:'', video_url:'', preparacion:'',
          activo:true, orden:(recetas.length + 1) * 10 };
  pintarEditor(); pintarLista();
});

function pintarEditor(){
  const r = sel;
  const cats = [...new Set(recetas.map(x => x.categoria).filter(Boolean))].sort();
  $('#panel').innerHTML = `
  <div class="ed">
    <h2>${r.id ? esc(r.nombre || 'Sin nombre') : 'Nuevo producto'}</h2>
    <p class="sub">${r.id ? 'Editando un producto publicado' : 'Se publica cuando lo guardes'}</p>

    <div class="bloque">
      <h3>Producto</h3>
      <div class="dos">
        <div class="campo"><label for="fNombre">Nombre</label>
          <input id="fNombre" value="${esc(r.nombre)}" placeholder="Té matcha frío"></div>
        <div class="campo"><label for="fCat">Categoría</label>
          <input id="fCat" list="dlCats" value="${esc(r.categoria)}" placeholder="Té matcha">
          <datalist id="dlCats">${cats.map(c => `<option value="${esc(c)}">`).join('')}</datalist>
          <p class="pista">Agrupa los productos en la pantalla de inicio.</p>
        </div>
      </div>
      <div class="campo"><label>Foto para la pantalla de inicio</label>
        <div class="foto-zona">
          <div class="foto-prev">${r.imagen_url ? `<img src="${esc(r.imagen_url)}" alt="">`
            : '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#5B2A82" stroke-width="1.7" opacity=".5"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m4 18 5-4 4 3 3-2 4 3"/></svg>'}</div>
          <div>
            <button class="sec" id="btnFoto">${r.imagen_url ? 'Cambiar foto' : 'Subir foto'}</button>
            ${r.imagen_url ? '<button class="sec peligro" id="btnQuitarFoto" style="margin-left:8px">Quitar</button>' : ''}
            <p class="pista">Vertical (4:5) es lo que mejor calza. Se comprime sola antes de subir.</p>
          </div>
        </div>
      </div>
      <div class="campo"><label for="fVideo">Link de video (opcional)</label>
        <input id="fVideo" value="${esc(r.video_url)}" placeholder="https://youtu.be/…">
        <p class="pista">YouTube, Vimeo o un <code>.mp4</code>. Aparece como botón “Ver video”.</p>
      </div>
    </div>

    <div class="bloque">
      <h3>Preparación</h3>
      <div class="escribir">
        <div>
          <textarea id="fPrep" placeholder="1. Servir 120 g de açaí hasta la primera marca del vaso&#10;2. Agregar 20 g de granola&#10;3. Terminar con leche condensada&#10;&#10;# Ojo&#10;- Nunca mezclar producto viejo con fresco">${esc(r.preparacion)}</textarea>
          <p class="pista">Escribe libre. <code>1.</code> numera el paso · <code>-</code> viñeta ·
            <code>#</code> subtítulo · <code>**negrita**</code></p>
        </div>
        <div class="previa">
          <p class="rot">Así se ve en el iPad</p>
          <div class="cuerpo" id="previa">${formatear(r.preparacion)}</div>
        </div>
      </div>
    </div>

    <div class="bloque" style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">
      <label class="switch"><input type="checkbox" id="fActivo" ${r.activo ? 'checked' : ''}><span class="p2"></span>Visible en los iPad</label>
      ${r.id ? `<button class="sec" id="btnDup">Duplicar</button>
                <button class="sec peligro" id="btnDel" style="margin-left:auto">Eliminar producto</button>` : ''}
    </div>
  </div>

  <div class="barra">
    <span class="est" id="estado">${r.id ? 'Todo guardado' : 'Sin guardar todavía'}</span>
    <button class="guardar" id="btnGuardar">${r.id ? 'Guardar cambios' : 'Publicar producto'}</button>
  </div>`;
  sucio = false;
}

/* listeners delegados: se enganchan una sola vez */
const P = $('#panel');
P.addEventListener('input', e => {
  if (!sel) return;
  const t = e.target;
  if (t.id === 'fNombre')      sel.nombre = t.value;
  else if (t.id === 'fCat')    sel.categoria = t.value;
  else if (t.id === 'fVideo')  sel.video_url = t.value;
  else if (t.id === 'fPrep'){  sel.preparacion = t.value; $('#previa').innerHTML = formatear(t.value) }
  else return;
  marcarSucio();
});
P.addEventListener('change', e => {
  if (sel && e.target.id === 'fActivo'){ sel.activo = e.target.checked; marcarSucio() }
});
P.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || !sel) return;
  if (b.id === 'btnFoto')        return pedirFoto(u => { sel.imagen_url = u; repintarConservando() });
  if (b.id === 'btnQuitarFoto'){ sel.imagen_url = ''; return repintarConservando() }
  if (b.id === 'btnGuardar')     return guardar();
  if (b.id === 'btnDup')         return duplicar();
  if (b.id === 'btnDel')         return borrar();
});
function repintarConservando(){ pintarEditor(); marcarSucio() }

/* ── guardar / duplicar / borrar / respaldo ──────────── */
async function guardar(){
  if (!sel.nombre.trim()) return aviso('Ponle un nombre al producto antes de publicarlo.', true);
  const b = $('#btnGuardar'), nuevo = !sel.id;
  b.disabled = true; b.textContent = 'Guardando…';
  const cuerpo = {
    nombre: sel.nombre.trim(),
    categoria: (sel.categoria || '').trim() || 'General',
    imagen_url: sel.imagen_url || null,
    video_url: (sel.video_url || '').trim() || null,
    preparacion: sel.preparacion || '',
    activo: !!sel.activo,
    orden: sel.orden ?? (recetas.length + 1) * 10
  };
  try {
    const res = nuevo
      ? await api('POST', '/recetario', cuerpo)
      : await api('PATCH', '/recetario?id=eq.' + encodeURIComponent(sel.id), cuerpo);
    const fila = Array.isArray(res) ? res[0] : res;
    if (fila) sel = Object.assign({}, fila);
    await traer(); pintarEditor();
    aviso(cuerpo.activo ? 'Publicado en los iPad' : 'Guardado (oculto en los iPad)');
  } catch(err){
    b.disabled = false; b.textContent = nuevo ? 'Publicar producto' : 'Guardar cambios';
    aviso('No se pudo guardar. ' + err.message, true);
  }
}

function duplicar(){
  sel = Object.assign({}, sel, { id:null, nombre:sel.nombre + ' (copia)', activo:false,
                                 orden:(recetas.length + 1) * 10 });
  pintarEditor(); marcarSucio();
  aviso('Copia lista. Revísala y publícala cuando quieras.');
}

async function borrar(){
  if (!confirm(`¿Eliminar “${sel.nombre}”? Desaparece de todos los iPad.`)) return;
  try {
    await api('DELETE', '/recetario?id=eq.' + encodeURIComponent(sel.id));
    sucio = false; await traer(); pintarVacio(); aviso('Producto eliminado');
  } catch(e){ aviso('No se pudo eliminar. ' + e.message, true) }
}

$('#btnCopia').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(recetas, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `recetario-nativo-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  aviso('Respaldo descargado');
});

window.addEventListener('beforeunload', e => { if (sucio){ e.preventDefault(); e.returnValue = '' } });

/* ── arranque ────────────────────────────────────────── */
try { if (sessionStorage.getItem('nativo:recetario:panel') === '1') abrirApp(); } catch(e){}
</script>
</body>
</html>
